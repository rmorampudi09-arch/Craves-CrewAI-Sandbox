trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      chmod +x scripts/release/validate-node-lockfiles.sh
      scripts/release/validate-node-lockfiles.sh .
    displayName: Require lockfiles and run npm ci gates
