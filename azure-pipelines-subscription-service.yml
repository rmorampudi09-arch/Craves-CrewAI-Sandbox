trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: acrName
    type: string
    default: cravesprodlowacr82121
  - name: containerAppName
    type: string
    default: ca-craves-subscription-service-p
  - name: imageTag
    type: string
    default: $(Build.BuildId)

variables:
  modulePath: services/subscription-service
  imageRepository: craves/subscription-service

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      bash scripts/release/validate-chef-owned-subscription-plans.sh
    displayName: Verify Chef-owned meal plan boundaries

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - script: |
      set -euo pipefail
      cd $(modulePath)
      mvn -B -ntp clean verify
    displayName: Maven build and tests

  - task: AzureCLI@2
    displayName: Verify Subscription PostgreSQL prerequisites
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/release/check-subscription-postgres-prerequisites.sh \
          '${{ parameters.resourceGroupName }}' \
          craves_business_db \
          pgcrypto

  - task: AzureCLI@2
    displayName: Build and push immutable Subscription image
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        ACR='${{ parameters.acrName }}'
        TAG='${{ parameters.imageTag }}'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$TAG"
        az acr login --name "$ACR" --only-show-errors
        docker build --pull -t "$IMAGE" "$(modulePath)"
        docker push "$IMAGE"
        echo "Image pushed: $IMAGE"

  - task: AzureCLI@2
    displayName: Deploy Subscription image without changing runtime configuration
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ACR='${{ parameters.acrName }}'
        APP='${{ parameters.containerAppName }}'
        TAG='${{ parameters.imageTag }}'
        ACR_LOGIN_SERVER=$(az acr show --name "$ACR" --query loginServer -o tsv --only-show-errors)
        [[ -n "$ACR_LOGIN_SERVER" ]] || { echo 'ERROR: ACR login server was not resolved.' >&2; exit 1; }
        IMAGE="$ACR_LOGIN_SERVER/$(imageRepository):$TAG"

        # Subscription startup can legitimately take longer on first rollout because Flyway may
        # apply the full service migration chain before readiness is reported. Keep explicit
        # failed/unhealthy states fail-fast, but allow up to six minutes for a target revision
        # that remains in Azure's non-failure Activating state.
        READY_ATTEMPTS=72 \
        READY_SLEEP_SECONDS=5 \
        bash scripts/release/deploy-single-service-preserve-runtime.sh \
          "$RG" \
          "$APP" \
          "$IMAGE" \
          subscription
