trigger: none
pr: none

parameters:
  - name: confirmInternalSecretMigration
    displayName: Confirm internal service secret migration to secretRef
    type: boolean
    default: false

  - name: resourceGroupName
    displayName: Resource group
    type: string
    default: rg-craves-prodlow-centralindia

  - name: subscriptionContainerAppName
    displayName: Subscription Container App
    type: string
    default: ca-craves-subscription-service-p

  - name: orderContainerAppName
    displayName: Order Container App
    type: string
    default: ca-craves-order-service-prodlow

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail
      bash -n scripts/release/subscription-sandbox-runtime-internal-secret-migrate.sh
      bash -n scripts/release/subscription-sandbox-runtime-preflight.sh

      if grep -nE 'local[^\n]*\bPATH=' \
        scripts/release/subscription-sandbox-runtime-internal-secret-migrate.sh \
        scripts/release/subscription-sandbox-runtime-preflight.sh; then
        echo 'ERROR: Runtime scripts must not shadow the process PATH variable.' >&2
        exit 1
      fi

      if grep -n 'mktemp' scripts/release/subscription-sandbox-runtime-internal-secret-migrate.sh; then
        echo 'ERROR: Internal-secret migration must not depend on mktemp.' >&2
        exit 1
      fi

      if grep -nE 'echo .*SHARED_VALUE|echo .*SUB_VALUE|echo .*ORDER_VALUE|set -x' \
        scripts/release/subscription-sandbox-runtime-internal-secret-migrate.sh; then
        echo 'ERROR: Potential internal-secret disclosure path detected.' >&2
        exit 1
      fi

      python3 - <<'PY'
      from pathlib import Path
      text = Path('scripts/release/subscription-sandbox-runtime-internal-secret-migrate.sh').read_text()
      required = [
          'CONFIRM_INTERNAL_SECRET_MIGRATION',
          'craves-internal-svc',
          'az containerapp secret set',
          'secretref:${LOCAL_SECRET_NAME}',
          'Subscription and Order internal-secret equality was proven',
          '/actuator/health/liveness',
          '/actuator/health/readiness',
      ]
      missing = [item for item in required if item not in text]
      if missing:
          raise SystemExit(f'Missing migration safety/health markers: {missing}')
      forbidden = [
          'CRAVES_CASHFREE_PRODUCTION_ACTIVATION_APPROVED=true',
          'CRAVES_CASHFREE_PRODUCTION_PAYMENT_EXECUTION_ENABLED=true',
          'az keyvault secret set',
      ]
      present = [item for item in forbidden if item in text]
      if present:
          raise SystemExit(f'Forbidden unrelated write found: {present}')
      print('Internal-secret migration static safety: PASS')
      PY
    displayName: Validate internal-secret migration safety

  - task: AzureCLI@2
    displayName: Migrate internal secret bindings and rerun preflight
    inputs:
      azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        export RESOURCE_GROUP='${{ parameters.resourceGroupName }}'
        export SUBSCRIPTION_APP='${{ parameters.subscriptionContainerAppName }}'
        export ORDER_APP='${{ parameters.orderContainerAppName }}'
        export CONFIRM_INTERNAL_SECRET_MIGRATION='${{ parameters.confirmInternalSecretMigration }}'

        bash scripts/release/subscription-sandbox-runtime-internal-secret-migrate.sh

        echo 'Internal-secret migration complete. Running the existing read-only sandbox runtime preflight in the same job.'
        bash scripts/release/subscription-sandbox-runtime-preflight.sh
