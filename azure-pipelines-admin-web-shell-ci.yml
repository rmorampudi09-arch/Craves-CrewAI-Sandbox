trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
    displayName: Typecheck and test admin shell
  - script: |
      set -euo pipefail
      grep -q 'roles.includes("ADMIN")' apps/customer-web-next/src/lib/admin-contract.ts
      if grep -REn '(accessToken|identityId|localStorage|sessionStorage|console\.(log|debug)|grantRole|setRole)' \
        apps/customer-web-next/src/lib/admin-contract.ts \
        apps/customer-web-next/src/app/api/admin/me \
        apps/customer-web-next/src/components/admin-shell.tsx \
        apps/customer-web-next/src/app/admin/page.tsx; then
        echo 'ERROR: Admin shell exposes tokens/identity IDs, insecure storage, logging or role mutation.' >&2
        exit 1
      fi
      echo 'Admin role and privacy gates passed.'
    displayName: Verify admin shell safety
