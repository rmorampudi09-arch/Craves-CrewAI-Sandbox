trigger: none
pr: none

parameters:
  - name: confirmation
    type: string
    default: NOT_APPROVED
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: authContainerAppName
    type: string
    default: ca-craves-auth-service-prodlow
  - name: userChefContainerAppName
    type: string
    default: ca-craves-user-chef-service-prod
  - name: catalogContainerAppName
    type: string
    default: ca-craves-catalog-service-prodlo
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: subscriptionContainerAppName
    type: string
    default: ca-craves-subscription-service-p
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: notificationContainerAppName
    type: string
    default: ca-craves-notification-service-p

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none

  - task: AzureCLI@2
    displayName: Validate and bind Redis URL to seven services
    env:
      CRAVES_REDIS_URL: $(SPRING_DATA_REDIS_URL)
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x
        [[ '${{ parameters.confirmation }}' == 'APPROVE_REDIS_SECRET_BINDING' ]] || {
          echo 'Explicit Redis secret-binding confirmation is required.' >&2
          exit 1
        }
        [[ -n "${CRAVES_REDIS_URL:-}" && "$CRAVES_REDIS_URL" != '$(SPRING_DATA_REDIS_URL)' ]] || {
          echo 'Secure pipeline variable SPRING_DATA_REDIS_URL is required.' >&2
          exit 1
        }

        python3 - <<'PY'
        import socket
        import ssl
        import sys
        from urllib.parse import unquote, urlparse
        import os

        raw = os.environ.get("CRAVES_REDIS_URL", "")
        parsed = urlparse(raw)
        if parsed.scheme not in {"redis", "rediss"} or not parsed.hostname:
            raise SystemExit("ERROR: SPRING_DATA_REDIS_URL must be a valid redis:// or rediss:// URL")
        port = parsed.port or (6380 if parsed.scheme == "rediss" else 6379)
        username = unquote(parsed.username or "")
        password = unquote(parsed.password or "")
        if not password:
            raise SystemExit("ERROR: Redis URL must contain a password")

        sock = socket.create_connection((parsed.hostname, port), timeout=10)
        try:
            if parsed.scheme == "rediss":
                context = ssl.create_default_context()
                sock = context.wrap_socket(sock, server_hostname=parsed.hostname)
            sock.settimeout(10)

            def command(*parts: str) -> bytes:
                payload = f"*{len(parts)}\r\n".encode()
                for part in parts:
                    encoded = part.encode()
                    payload += f"${len(encoded)}\r\n".encode() + encoded + b"\r\n"
                sock.sendall(payload)
                return sock.recv(4096)

            auth = command("AUTH", username, password) if username else command("AUTH", password)
            if not auth.startswith(b"+OK"):
                raise SystemExit("ERROR: Redis authentication failed")
            pong = command("PING")
            if not pong.startswith(b"+PONG"):
                raise SystemExit("ERROR: Redis PING failed")
            print("Redis authentication and PING succeeded; credentials were not printed.")
        finally:
            sock.close()
        PY

        RG='${{ parameters.resourceGroupName }}'
        apps=(
          '${{ parameters.authContainerAppName }}'
          '${{ parameters.userChefContainerAppName }}'
          '${{ parameters.catalogContainerAppName }}'
          '${{ parameters.orderContainerAppName }}'
          '${{ parameters.subscriptionContainerAppName }}'
          '${{ parameters.integrationContainerAppName }}'
          '${{ parameters.notificationContainerAppName }}'
        )

        for app in "${apps[@]}"; do
          az containerapp show -g "$RG" -n "$app" -o none
          az containerapp secret set -g "$RG" -n "$app" --secrets redis-url="$CRAVES_REDIS_URL" -o none
          if [[ "$app" == '${{ parameters.authContainerAppName }}' ]]; then
            az containerapp update -g "$RG" -n "$app" --set-env-vars \
              SPRING_DATA_REDIS_URL=secretref:redis-url \
              CRAVES_TOKEN_REVOCATION_PUBLISHER_ENABLED=false \
              CRAVES_TOKEN_REVOCATION_ENABLED=false \
              CRAVES_AUTH_RATE_LIMIT_ENABLED=false \
              -o none
          else
            az containerapp update -g "$RG" -n "$app" --set-env-vars \
              SPRING_DATA_REDIS_URL=secretref:redis-url \
              CRAVES_TOKEN_REVOCATION_ENABLED=false \
              -o none
          fi

          latest=''
          ready=''
          running=''
          redis_ref=''
          consumer=''
          publisher='false'
          limiter='false'
          for attempt in $(seq 1 60); do
            json=$(az containerapp show -g "$RG" -n "$app" -o json)
            latest=$(jq -r '.properties.latestRevisionName // ""' <<<"$json")
            ready=$(jq -r '.properties.latestReadyRevisionName // ""' <<<"$json")
            running=$(jq -r '.properties.runningStatus // ""' <<<"$json")
            redis_ref=$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "SPRING_DATA_REDIS_URL")][0].secretRef // ""' <<<"$json")
            consumer=$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "CRAVES_TOKEN_REVOCATION_ENABLED")][0].value // ""' <<<"$json")
            if [[ "$app" == '${{ parameters.authContainerAppName }}' ]]; then
              publisher=$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "CRAVES_TOKEN_REVOCATION_PUBLISHER_ENABLED")][0].value // ""' <<<"$json")
              limiter=$(jq -r '[.properties.template.containers[0].env[]? | select(.name == "CRAVES_AUTH_RATE_LIMIT_ENABLED")][0].value // ""' <<<"$json")
            fi
            echo "Attempt $attempt/60 app=$app latest=$latest ready=$ready running=$running redisRef=$redis_ref consumer=$consumer publisher=$publisher limiter=$limiter"
            if [[ -n "$latest" && "$latest" == "$ready" && "$running" == 'Running' && "$redis_ref" == 'redis-url' && "${consumer,,}" == 'false' && "${publisher,,}" == 'false' && "${limiter,,}" == 'false' ]]; then
              break
            fi
            sleep 10
          done
          [[ -n "$latest" && "$latest" == "$ready" && "$running" == 'Running' && "$redis_ref" == 'redis-url' && "${consumer,,}" == 'false' && "${publisher,,}" == 'false' && "${limiter,,}" == 'false' ]] || {
            echo "ERROR: $app did not become ready with Redis bound and security controls disabled." >&2
            exit 1
          }
        done

        echo 'SUCCESS: Redis URL is secret-bound to all seven services. Publisher, consumers and rate limiter remain disabled.'
        echo 'No Redis resource was created and no revocation/rate-limit feature was activated.'
