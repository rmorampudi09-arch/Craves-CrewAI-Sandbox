trigger: none
pr: none

parameters:
  - name: targetEnvironment
    displayName: Shiprocket execution environment
    type: string
    default: READ_ONLY
    values:
      - READ_ONLY
      - SANDBOX
      - PRODUCTION
  - name: enableProvider
    displayName: Enable authenticated read-only Shiprocket API access
    type: boolean
    default: false
  - name: enableCreate
    displayName: Allow Shiprocket shipment creation and intelligent-routing participation
    type: boolean
    default: false
  - name: confirmProductionActivation
    displayName: Confirm production mutation activation
    type: boolean
    default: false
  - name: attributionApproved
    displayName: Confirm Shiprocket/courier attribution has been operationally approved
    type: boolean
    default: false
  - name: providerBaseUrl
    type: string
    default: https://apiv2.shiprocket.in/v1/external
  - name: callbackUrl
    displayName: Neutral callback configured in Shiprocket
    type: string
    default: https://api.craves.in/api/v1/webhooks/delivery/p4
  - name: apiEmailSecretName
    type: string
    default: shiprocket-api-email
  - name: apiPasswordSecretName
    type: string
    default: shiprocket-api-password
  - name: webhookTokenSecretName
    type: string
    default: shiprocket-webhook-token
  - name: orderEmail
    displayName: Billing/order email sent on Shiprocket shipments
    type: string
    default: ''
  - name: packageLengthCm
    type: string
    default: ''
  - name: packageBreadthCm
    type: string
    default: ''
  - name: packageHeightCm
    type: string
    default: ''
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: apimName
    type: string
    default: apim-craves-prodlow-l3ing6

variables:
  AZURE_SERVICE_CONNECTION: Craves-Dev-Service-Connection

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    clean: true
    persistCredentials: false

  - task: AzureCLI@2
    displayName: Apply guarded Shiprocket read-only / production switch
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        set +x

        RG='${{ parameters.resourceGroupName }}'
        APP='${{ parameters.integrationContainerAppName }}'
        ORDER_APP='${{ parameters.orderContainerAppName }}'
        APIM='${{ parameters.apimName }}'
        configured_environment='${{ parameters.targetEnvironment }}'
        enable_provider_raw='${{ parameters.enableProvider }}'
        enable_provider="${enable_provider_raw,,}"
        enable_create_raw='${{ parameters.enableCreate }}'
        enable_create="${enable_create_raw,,}"
        confirm_raw='${{ parameters.confirmProductionActivation }}'
        confirm="${confirm_raw,,}"
        attribution_raw='${{ parameters.attributionApproved }}'
        attribution="${attribution_raw,,}"
        base_url='${{ parameters.providerBaseUrl }}'
        callback_url='${{ parameters.callbackUrl }}'
        email_secret='${{ parameters.apiEmailSecretName }}'
        password_secret='${{ parameters.apiPasswordSecretName }}'
        webhook_secret='${{ parameters.webhookTokenSecretName }}'
        order_email='${{ parameters.orderEmail }}'
        package_length='${{ parameters.packageLengthCm }}'
        package_breadth='${{ parameters.packageBreadthCm }}'
        package_height='${{ parameters.packageHeightCm }}'
        app_yml='services/integration-service/src/main/resources/application.yml'
        adapter_dir='services/integration-service/src/main/java/in/craves/integration/delivery/shiprocket'

        fail() { echo "ERROR: $*" >&2; exit 2; }

        wait_ready() {
          local app="$1"
          local latest ready
          latest="$(az containerapp show -g "$RG" -n "$app" --query properties.latestRevisionName -o tsv --only-show-errors)"
          for _ in $(seq 1 60); do
            ready="$(az containerapp show -g "$RG" -n "$app" --query properties.latestReadyRevisionName -o tsv --only-show-errors 2>/dev/null || true)"
            [[ "$ready" == "$latest" ]] && return 0
            sleep 10
          done
          fail "$app revision $latest did not become ready."
        }

        positive_decimal() {
          [[ "$1" =~ ^[0-9]+([.][0-9]+)?$ ]] || return 1
          awk -v value="$1" 'BEGIN { exit !(value > 0) }'
        }

        [[ "$enable_provider" == 'true' || "$enable_provider" == 'false' ]] || fail 'enableProvider is invalid.'
        [[ "$enable_create" == 'true' || "$enable_create" == 'false' ]] || fail 'enableCreate is invalid.'
        [[ "$configured_environment" == 'READ_ONLY' || "$configured_environment" == 'SANDBOX' || "$configured_environment" == 'PRODUCTION' ]] || fail 'targetEnvironment is invalid.'

        runtime_environment="$configured_environment"
        [[ "$runtime_environment" == 'SANDBOX' ]] && runtime_environment='READ_ONLY'

        grep -Fq 'enabled: ${SHIPROCKET_API_ENABLED:false}' "$app_yml" || fail 'SHIPROCKET_API_ENABLED is not fail-closed.'
        grep -Fq 'create-enabled: ${SHIPROCKET_CREATE_ENABLED:false}' "$app_yml" || fail 'SHIPROCKET_CREATE_ENABLED is not fail-closed.'
        grep -Fq 'environment: ${SHIPROCKET_API_ENVIRONMENT:READ_ONLY}' "$app_yml" || fail 'Shiprocket does not default to READ_ONLY.'
        grep -Fq 'production-activation-approved: ${SHIPROCKET_PRODUCTION_ACTIVATION_APPROVED:false}' "$app_yml" || fail 'Production approval does not default false.'
        grep -Fq 'attribution-approved: ${SHIPROCKET_ATTRIBUTION_APPROVED:false}' "$app_yml" || fail 'Attribution approval does not default false.'
        grep -Fq 'email: ${SHIPROCKET_API_EMAIL:}' "$app_yml" || fail 'API email binding is missing.'
        grep -Fq 'password: ${SHIPROCKET_API_PASSWORD:}' "$app_yml" || fail 'API password binding is missing.'
        grep -Fq 'webhook-token: ${SHIPROCKET_WEBHOOK_TOKEN:}' "$app_yml" || fail 'Webhook token binding is missing.'
        [[ -d "$adapter_dir" ]] && find "$adapter_dir" -type f -name '*.java' -print -quit | grep -q . || fail 'Shiprocket adapter is missing.'
        grep -R -Fq '@PostMapping("/p4")' "$adapter_dir" || fail 'Neutral Shiprocket /p4 webhook route is missing.'

        [[ "$base_url" == https://* ]] || fail 'Shiprocket API base URL must use HTTPS.'
        base_host="$(python3 -c 'from urllib.parse import urlparse; import sys; print((urlparse(sys.argv[1]).hostname or "").lower())' "$base_url")"
        [[ "$base_host" == 'apiv2.shiprocket.in' ]] || fail 'Shiprocket base URL must use the approved apiv2.shiprocket.in host.'

        if [[ "$enable_create" == 'true' ]]; then
          [[ "$enable_provider" == 'true' ]] || fail 'enableCreate=true requires enableProvider=true.'
          [[ "$runtime_environment" == 'PRODUCTION' ]] || fail 'Shiprocket create is allowed only in PRODUCTION.'
          [[ "$confirm" == 'true' ]] || fail 'Production create requires confirmProductionActivation=true.'
          [[ "$attribution" == 'true' ]] || fail 'Production create requires attributionApproved=true.'
          [[ -n "$order_email" && "$order_email" == *@*.* ]] || fail 'A valid orderEmail is required.'
          positive_decimal "$package_length" || fail 'packageLengthCm must be positive.'
          positive_decimal "$package_breadth" || fail 'packageBreadthCm must be positive.'
          positive_decimal "$package_height" || fail 'packageHeightCm must be positive.'
          [[ "$callback_url" == https://*'/api/v1/webhooks/delivery/p4' ]] || fail 'Shiprocket callback must use the neutral /p4 route.'
          callback_lower="${callback_url,,}"
          [[ "$callback_lower" != *shiprocket* && "$callback_lower" != *kartrocket* ]] || fail 'Shiprocket callback URL must remain provider-neutral.'
        elif [[ "$runtime_environment" == 'PRODUCTION' && "$confirm" != 'true' ]]; then
          fail 'Selecting PRODUCTION requires confirmProductionActivation=true.'
        fi

        if [[ "$enable_provider" == 'true' ]]; then
          secrets="$(az containerapp secret list -g "$RG" -n "$APP" --query '[].name' -o tsv --only-show-errors)"
          grep -qx "$email_secret" <<<"$secrets" || fail "Missing Container App secret $email_secret."
          grep -qx "$password_secret" <<<"$secrets" || fail "Missing Container App secret $password_secret."
          if [[ "$enable_create" == 'true' ]]; then
            grep -qx "$webhook_secret" <<<"$secrets" || fail "Missing Container App secret $webhook_secret."
          fi
        fi

        db_url="$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_URL']|[0].value" -o tsv --only-show-errors)"
        db_user="$(az containerapp show -g "$RG" -n "$APP" --query "properties.template.containers[0].env[?name=='SPRING_DATASOURCE_USERNAME']|[0].value" -o tsv --only-show-errors)"
        db_secret_url="$(az containerapp secret list -g "$RG" -n "$APP" --query "[?name=='kv-db-password']|[0].keyVaultUrl" -o tsv --only-show-errors)"
        [[ "$db_url" == jdbc:postgresql://* && -n "$db_user" && "$db_secret_url" == https://*.vault.azure.net/secrets/* ]] || fail 'Integration DB binding is incomplete.'
        vault_name="$(cut -d. -f1 <<<"${db_secret_url#https://}")"
        db_secret_name="${db_secret_url##*/}"
        db_password="$(az keyvault secret show --vault-name "$vault_name" --name "$db_secret_name" --query value -o tsv --only-show-errors)"
        [[ -n "$db_password" ]] || fail 'Integration DB password could not be resolved.'
        export PGPASSWORD="$db_password" PGUSER="$db_user"
        DB="${db_url#jdbc:}"

        [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE provider_id='shiprocket';")" == '1' ]] || fail 'Shiprocket provider catalog row is missing.'
        [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('delivery_schema.delivery_provider_pickup_location') IS NOT NULL;")" == 't' ]] || fail 'Provider pickup-location mapping migration is missing.'

        current_env_json="$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].env' -o json --only-show-errors)"
        current_value() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // "")' <<<"$current_env_json" | tail -1; }
        current_environment="$(current_value SHIPROCKET_API_ENVIRONMENT)"
        [[ "$current_environment" == 'SANDBOX' ]] && current_environment='READ_ONLY'
        [[ -n "$current_environment" ]] || current_environment='READ_ONLY'

        if [[ "$current_environment" != "$runtime_environment" ]]; then
          open_jobs="$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_job WHERE provider_id='shiprocket' AND status NOT IN ('DELIVERED','CANCELLED','RETURNED','FAILED');")"
          [[ "$open_jobs" == '0' ]] || fail "Cannot change Shiprocket execution environment while $open_jobs Shiprocket job(s) are non-terminal."
        fi

        if [[ "$enable_create" == 'true' ]]; then
          verified_pickups="$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider_pickup_location WHERE provider_id='shiprocket' AND is_verified=TRUE AND NULLIF(BTRIM(external_location_code),'') IS NOT NULL;")"
          [[ "$verified_pickups" -ge 1 ]] || fail 'At least one verified kitchen -> Shiprocket pickup mapping is required.'

          mapfile -t API_IDS < <(az apim api list -g "$RG" --service-name "$APIM" --query "[?path=='api/v1/webhooks/delivery'].name" -o tsv --only-show-errors)
          (( ${#API_IDS[@]} == 1 )) || fail 'Expected exactly one APIM delivery webhook API.'
          operations="$(az apim api operation list -g "$RG" --service-name "$APIM" --api-id "${API_IDS[0]}" -o json --only-show-errors)"
          [[ "$(jq '[.[] | select((.method | ascii_upcase) == "POST" and .urlTemplate == "/p4")] | length' <<<"$operations")" == '1' ]] || fail 'Neutral APIM POST /p4 route is missing.'
        fi

        # Take Shiprocket out of routing before touching its runtime. If this leaves no active
        # provider, pause command consumption so no command can be claimed during the cutover.
        psql "$DB" -v ON_ERROR_STOP=1 -c "UPDATE delivery_schema.delivery_provider SET is_active=FALSE, updated_at=now() WHERE provider_id='shiprocket';" >/dev/null
        [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE provider_id='shiprocket' AND is_active=TRUE;")" == '0' ]] || fail 'Shiprocket could not be removed from routing before reconfiguration.'
        other_active_count="$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM delivery_schema.delivery_provider WHERE is_active=TRUE;")"
        if [[ "$other_active_count" == '0' ]]; then
          az containerapp update -g "$RG" -n "$APP" --set-env-vars CRAVES_DELIVERY_COMMAND_ENABLED=false >/dev/null
          wait_ready "$APP"
        else
          echo "INFO: $other_active_count other provider(s) remain active; command worker stays available for them."
        fi

        if [[ "$enable_provider" == 'false' ]]; then
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              SHIPROCKET_API_ENVIRONMENT="$runtime_environment" \
              SHIPROCKET_API_ENABLED=false \
              SHIPROCKET_CREATE_ENABLED=false \
              SHIPROCKET_PRODUCTION_ACTIVATION_APPROVED=false \
              SHIPROCKET_ATTRIBUTION_APPROVED=false \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
        elif [[ "$enable_create" == 'false' ]]; then
          production_approved=false
          [[ "$runtime_environment" == 'PRODUCTION' ]] && production_approved="$confirm"
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              SHIPROCKET_API_ENVIRONMENT="$runtime_environment" \
              SHIPROCKET_API_BASE_URL="$base_url" \
              SHIPROCKET_API_EMAIL="secretref:${email_secret}" \
              SHIPROCKET_API_PASSWORD="secretref:${password_secret}" \
              SHIPROCKET_API_ENABLED=true \
              SHIPROCKET_CREATE_ENABLED=false \
              SHIPROCKET_PRODUCTION_ACTIVATION_APPROVED="$production_approved" \
              SHIPROCKET_ATTRIBUTION_APPROVED=false \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
        else
          az containerapp update -g "$RG" -n "$APP" \
            --set-env-vars \
              SHIPROCKET_API_ENVIRONMENT=PRODUCTION \
              SHIPROCKET_API_BASE_URL="$base_url" \
              SHIPROCKET_API_EMAIL="secretref:${email_secret}" \
              SHIPROCKET_API_PASSWORD="secretref:${password_secret}" \
              SHIPROCKET_WEBHOOK_TOKEN="secretref:${webhook_secret}" \
              SHIPROCKET_ORDER_EMAIL="$order_email" \
              SHIPROCKET_PACKAGE_LENGTH_CM="$package_length" \
              SHIPROCKET_PACKAGE_BREADTH_CM="$package_breadth" \
              SHIPROCKET_PACKAGE_HEIGHT_CM="$package_height" \
              SHIPROCKET_API_ENABLED=true \
              SHIPROCKET_CREATE_ENABLED=true \
              SHIPROCKET_PRODUCTION_ACTIVATION_APPROVED=true \
              SHIPROCKET_ATTRIBUTION_APPROVED=true \
              CRAVES_DELIVERY_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=true \
              CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=true \
              CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=true \
              CRAVES_DELIVERY_INTELLIGENCE_ENABLED=true >/dev/null
        fi
        wait_ready "$APP"

        if [[ "$enable_create" == 'true' ]]; then
          # Prepare both directions of the Order Service event flow before Shiprocket becomes routable.
          az containerapp update -g "$RG" -n "$ORDER_APP" \
            --set-env-vars \
              CRAVES_DOMAIN_EVENT_OUTBOX_ENABLED=true \
              CRAVES_DOMAIN_EVENT_SERVICE_BUS_ENABLED=true \
              CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED=true >/dev/null
          wait_ready "$ORDER_APP"

          psql "$DB" -v ON_ERROR_STOP=1 -c "UPDATE delivery_schema.delivery_provider SET is_active=TRUE, updated_at=now() WHERE provider_id='shiprocket';" >/dev/null
          [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT is_active FROM delivery_schema.delivery_provider WHERE provider_id='shiprocket';")" == 't' ]] || fail 'Shiprocket DB activation verification failed.'

          az containerapp update -g "$RG" -n "$APP" --set-env-vars CRAVES_DELIVERY_COMMAND_ENABLED=true >/dev/null
          wait_ready "$APP"
        fi

        env_json="$(az containerapp show -g "$RG" -n "$APP" --query 'properties.template.containers[0].env' -o json --only-show-errors)"
        value() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // .secretRef // "")' <<<"$env_json" | tail -1; }
        [[ "$(value SHIPROCKET_API_ENVIRONMENT)" == "$runtime_environment" ]] || fail 'Shiprocket environment verification failed.'
        [[ "$(value SHIPROCKET_API_ENABLED)" == "$enable_provider" ]] || fail 'Shiprocket API enabled-state verification failed.'
        [[ "$(value SHIPROCKET_CREATE_ENABLED)" == "$enable_create" ]] || fail 'Shiprocket create enabled-state verification failed.'

        expected_active='f'
        [[ "$enable_create" == 'true' ]] && expected_active='t'
        [[ "$(psql "$DB" -At -v ON_ERROR_STOP=1 -c "SELECT is_active FROM delivery_schema.delivery_provider WHERE provider_id='shiprocket';")" == "$expected_active" ]] || fail 'Shiprocket DB routing-state verification failed.'

        if [[ "$enable_create" == 'true' ]]; then
          [[ "$(value CRAVES_DELIVERY_COMMAND_ENABLED)" == 'true' ]] || fail 'Delivery command worker is not enabled.'
          order_env="$(az containerapp show -g "$RG" -n "$ORDER_APP" --query 'properties.template.containers[0].env' -o json --only-show-errors)"
          order_value() { jq -r --arg name "$1" '.[] | select(.name == $name) | (.value // "")' <<<"$order_env" | tail -1; }
          [[ "$(order_value CRAVES_DOMAIN_EVENT_OUTBOX_ENABLED)" == 'true' ]] || fail 'Order outbox is not enabled.'
          [[ "$(order_value CRAVES_DOMAIN_EVENT_SERVICE_BUS_ENABLED)" == 'true' ]] || fail 'Order domain-event publisher is not enabled.'
          [[ "$(order_value CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED)" == 'true' ]] || fail 'Order delivery-status consumer is not enabled.'
        fi

        unset db_password PGPASSWORD PGUSER

        echo '============================================================'
        echo 'SHIPROCKET DELIVERY PROVIDER SWITCH: PASS'
        echo "Configured environment: $configured_environment"
        echo "Runtime execution mode: $runtime_environment"
        echo "Authenticated read-only API enabled: $enable_provider"
        echo "Shipment create enabled: $enable_create"
        if [[ "$enable_create" == 'true' ]]; then
          echo 'Mode: PRODUCTION_CREATE'
        elif [[ "$enable_provider" == 'true' ]]; then
          echo 'Mode: READ_ONLY_PROVIDER_VALIDATION'
        else
          echo 'Mode: FAIL_CLOSED'
        fi
        echo 'Order projection and runtime are ready before DB routing activation.'
        echo '============================================================'
