trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: subscriptionContainerAppName
    type: string
    default: ca-craves-subscription-service-p
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: serviceBusNamespace
    type: string
    default: sb-craves-prodlow-l3ing6
  - name: serviceBusTopic
    type: string
    default: craves-domain-events
  - name: apimName
    type: string
    default: apim-craves-prodlow-l3ing6
  - name: apimHost
    type: string
    default: api.craves.in

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: AzureCLI@2
    displayName: Verify Subscription sandbox runtime status
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/release/subscription-sandbox-runtime-status.sh
    env:
      RESOURCE_GROUP: ${{ parameters.resourceGroupName }}
      SUBSCRIPTION_APP: ${{ parameters.subscriptionContainerAppName }}
      INTEGRATION_APP: ${{ parameters.integrationContainerAppName }}
      ORDER_APP: ${{ parameters.orderContainerAppName }}
      SERVICE_BUS_NAMESPACE: ${{ parameters.serviceBusNamespace }}
      SERVICE_BUS_TOPIC: ${{ parameters.serviceBusTopic }}
      APIM_NAME: ${{ parameters.apimName }}
      APIM_HOST: ${{ parameters.apimHost }}
