trigger:
  branches:
    include:
      - main
      - develop
      - stage

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: BuildApi
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd apps/api
        npm ci
        npm run build
      displayName: Build API

  - job: BuildCustomerWeb
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd apps/customer-web
        npm ci
        npm run build
      displayName: Build Customer Web

  - job: BuildAdminPortal
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '20.x'
    - script: |
        cd apps/admin-portal
        npm ci
        npm run build
      displayName: Build Admin Portal
