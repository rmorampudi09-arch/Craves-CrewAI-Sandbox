trigger: none
pr: none

parameters:
  - name: rollbackTarget
    type: string
    default: safe_publisher_only
    values:
      - safe_publisher_only
      - stage1_request_publication
      - stage2_timeout_worker
      - stage3_cashfree_sandbox_execution
      - stage4_reconciliation
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Roll back refund flow to ${{ parameters.rollbackTarget }}
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/refund/rollback-refund-stage.sh
    env:
      ROLLBACK_TARGET: ${{ parameters.rollbackTarget }}
      RESOURCE_GROUP: ${{ parameters.resourceGroupName }}
      ORDER_APP: ${{ parameters.orderContainerAppName }}
      INTEGRATION_APP: ${{ parameters.integrationContainerAppName }}
