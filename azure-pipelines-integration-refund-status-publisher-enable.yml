trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: serviceBusNamespace
    type: string
    default: sb-craves-prodlow-l3ing6
  - name: serviceBusFullyQualifiedNamespace
    type: string
    default: sb-craves-prodlow-l3ing6.servicebus.windows.net
  - name: topicName
    type: string
    default: craves-domain-events
  - name: orderSubscriptionName
    type: string
    default: order-service-refund-status-changed
  - name: orderSubscriptionRuleName
    type: string
    default: refund-status-changed-only

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Verify dependencies and enable REFUND_STATUS_CHANGED publisher
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        RG='${{ parameters.resourceGroupName }}'
        INTEGRATION_APP='${{ parameters.integrationContainerAppName }}'
        ORDER_APP='${{ parameters.orderContainerAppName }}'
        NS='${{ parameters.serviceBusNamespace }}'
        FQNS='${{ parameters.serviceBusFullyQualifiedNamespace }}'
        TOPIC='${{ parameters.topicName }}'
        ORDER_SUB='${{ parameters.orderSubscriptionName }}'
        ORDER_RULE='${{ parameters.orderSubscriptionRuleName }}'

        expected_fqns="$NS.servicebus.windows.net"
        if [[ "$FQNS" != "$expected_fqns" ]]; then
          echo "ERROR: Fully-qualified namespace must be $expected_fqns"
          exit 1
        fi

        read_env() {
          local app="$1"
          local name="$2"
          az containerapp show \
            --resource-group "$RG" \
            --name "$app" \
            --query "properties.template.containers[0].env[?name=='$name'].value | [0]" \
            --output tsv
        }

        require_true() {
          local label="$1"
          local value="$2"
          if [[ "${value,,}" != "true" ]]; then
            echo "ERROR: $label must be true. Current value: ${value:-<empty>}"
            exit 1
          fi
        }

        require_false_or_empty() {
          local label="$1"
          local value="$2"
          if [[ -n "$value" && "${value,,}" != "false" ]]; then
            echo "ERROR: $label must be false or absent. Current value: $value"
            exit 1
          fi
        }

        az servicebus topic show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --name "$TOPIC" \
          --output none

        az servicebus topic subscription show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --name "$ORDER_SUB" \
          --output none

        FILTER_TYPE=$(az servicebus topic subscription rule show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --subscription-name "$ORDER_SUB" \
          --name "$ORDER_RULE" \
          --query filterType \
          --output tsv)

        FILTER_EXPRESSION=$(az servicebus topic subscription rule show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --subscription-name "$ORDER_SUB" \
          --name "$ORDER_RULE" \
          --query sqlFilter.sqlExpression \
          --output tsv)

        if [[ "$FILTER_TYPE" != "SqlFilter" \
              || "$FILTER_EXPRESSION" != *"eventType"* \
              || "$FILTER_EXPRESSION" != *"REFUND_STATUS_CHANGED"* ]]; then
          echo "ERROR: Order refund-status subscription filter is not the approved SQL filter."
          echo "Filter type: $FILTER_TYPE"
          echo "Expression:  $FILTER_EXPRESSION"
          exit 1
        fi

        ORDER_DLQ_COUNT=$(az servicebus topic subscription show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --topic-name "$TOPIC" \
          --name "$ORDER_SUB" \
          --query countDetails.deadLetterMessageCount \
          --output tsv)

        if [[ "${ORDER_DLQ_COUNT:-0}" != "0" ]]; then
          echo "ERROR: Order refund-status subscription DLQ must be empty before publisher activation."
          echo "Current DLQ count: $ORDER_DLQ_COUNT"
          exit 1
        fi

        ORDER_CONSUMER=$(read_env "$ORDER_APP" CRAVES_REFUND_STATUS_CONSUMER_ENABLED)
        ORDER_TIMEOUT_WORKER=$(read_env "$ORDER_APP" CRAVES_CHEF_ACCEPTANCE_WORKER_ENABLED)
        ORDER_EVENT_TYPES=$(read_env "$ORDER_APP" CRAVES_DOMAIN_EVENT_ENABLED_TYPES)

        require_true "Order refund-status consumer" "$ORDER_CONSUMER"
        require_false_or_empty "Order chef acceptance timeout worker" "$ORDER_TIMEOUT_WORKER"

        if [[ "$ORDER_EVENT_TYPES" != "CHEF_ACCEPTED_ORDER" ]]; then
          echo "ERROR: Order domain-event allow-list must remain CHEF_ACCEPTED_ORDER only."
          echo "Current value: ${ORDER_EVENT_TYPES:-<empty>}"
          exit 1
        fi

        INTEGRATION_CONSUMER=$(read_env "$INTEGRATION_APP" CRAVES_REFUND_CONSUMER_ENABLED)
        PROVIDER_EXECUTION=$(read_env "$INTEGRATION_APP" CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED)
        RECONCILIATION=$(read_env "$INTEGRATION_APP" CRAVES_REFUND_RECONCILIATION_ENABLED)
        CURRENT_PUBLISHER=$(read_env "$INTEGRATION_APP" CRAVES_REFUND_STATUS_PUBLISHER_ENABLED)
        DELIVERY_COMMAND=$(read_env "$INTEGRATION_APP" CRAVES_DELIVERY_COMMAND_ENABLED)
        BORZO_ENABLED=$(read_env "$INTEGRATION_APP" BORZO_API_ENABLED)

        require_true "Integration refund consumer" "$INTEGRATION_CONSUMER"
        require_false_or_empty "Cashfree refund provider execution" "$PROVIDER_EXECUTION"
        require_false_or_empty "Refund reconciliation" "$RECONCILIATION"
        require_false_or_empty "Delivery command execution" "$DELIVERY_COMMAND"
        require_false_or_empty "Borzo API execution" "$BORZO_ENABLED"

        PRINCIPAL_ID=$(az containerapp show \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --query identity.principalId \
          --output tsv)

        if [[ -z "$PRINCIPAL_ID" || "$PRINCIPAL_ID" == "null" ]]; then
          echo "ERROR: Integration Container App does not have a system-assigned managed identity."
          exit 1
        fi

        NAMESPACE_SCOPE=$(az servicebus namespace show \
          --resource-group "$RG" \
          --name "$NS" \
          --query id \
          --output tsv)

        TOPIC_SCOPE=$(az servicebus topic show \
          --resource-group "$RG" \
          --namespace-name "$NS" \
          --name "$TOPIC" \
          --query id \
          --output tsv)

        SENDER_COUNT=$(az role assignment list \
          --assignee-object-id "$PRINCIPAL_ID" \
          --all \
          --query "[?roleDefinitionName=='Azure Service Bus Data Sender' && (scope=='$NAMESPACE_SCOPE' || scope=='$TOPIC_SCOPE')] | length(@)" \
          --output tsv)

        if [[ "${SENDER_COUNT:-0}" == "0" ]]; then
          echo "ERROR: Integration managed identity is missing Azure Service Bus Data Sender."
          echo "PRINCIPAL_ID=$PRINCIPAL_ID"
          echo "NAMESPACE_SCOPE=$NAMESPACE_SCOPE"
          echo "TOPIC_SCOPE=$TOPIC_SCOPE"
          echo "Grant the role once with an authorized Azure account, then rerun this pipeline."
          exit 2
        fi

        LATEST=$(az containerapp show \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --query properties.latestRevisionName \
          --output tsv)
        READY=$(az containerapp show \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --query properties.latestReadyRevisionName \
          --output tsv)
        RUNNING=$(az containerapp show \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --query properties.runningStatus \
          --output tsv)

        if [[ "${CURRENT_PUBLISHER,,}" == "true" ]]; then
          if [[ "$LATEST" == "$READY" && "$RUNNING" == "Running" ]]; then
            echo "SUCCESS: Refund status publisher is already enabled and all safety checks passed."
            exit 0
          fi
          echo "ERROR: Publisher is enabled but the latest Integration revision is not ready."
          exit 1
        fi

        PREVIOUS_LATEST="$LATEST"

        az containerapp update \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --set-env-vars \
            CRAVES_REFUND_CONSUMER_ENABLED=true \
            CRAVES_REFUND_PROVIDER_EXECUTION_ENABLED=false \
            CRAVES_REFUND_RECONCILIATION_ENABLED=false \
            CRAVES_REFUND_STATUS_PUBLISHER_ENABLED=true \
            CRAVES_DELIVERY_COMMAND_ENABLED=false \
            BORZO_API_ENABLED=false \
            SERVICE_BUS_FULLY_QUALIFIED_NAMESPACE="$FQNS" \
            SERVICE_BUS_TOPIC_NAME="$TOPIC" \
          --output none

        echo "Waiting for a healthy Integration revision with refund-status publication enabled..."

        for ATTEMPT in $(seq 1 60); do
          LATEST=$(az containerapp show \
            --resource-group "$RG" \
            --name "$INTEGRATION_APP" \
            --query properties.latestRevisionName \
            --output tsv)
          READY=$(az containerapp show \
            --resource-group "$RG" \
            --name "$INTEGRATION_APP" \
            --query properties.latestReadyRevisionName \
            --output tsv)
          RUNNING=$(az containerapp show \
            --resource-group "$RG" \
            --name "$INTEGRATION_APP" \
            --query properties.runningStatus \
            --output tsv)
          HEALTH=$(az containerapp revision show \
            --resource-group "$RG" \
            --name "$INTEGRATION_APP" \
            --revision "$LATEST" \
            --query properties.healthState \
            --output tsv 2>/dev/null || true)

          echo "Attempt $ATTEMPT/60: latest=$LATEST ready=$READY health=$HEALTH running=$RUNNING"

          if [[ "$LATEST" != "$PREVIOUS_LATEST" \
                && "$LATEST" == "$READY" \
                && "$HEALTH" == "Healthy" \
                && "$RUNNING" == "Running" ]]; then
            echo "SUCCESS: REFUND_STATUS_CHANGED publisher enabled."
            echo "Cashfree execution, reconciliation, delivery commands, Borzo and Order timeout publication remain disabled."
            az containerapp show \
              --resource-group "$RG" \
              --name "$INTEGRATION_APP" \
              --query "properties.template.containers[0].env[?starts_with(name, 'CRAVES_REFUND_') || name=='CRAVES_DELIVERY_COMMAND_ENABLED' || name=='BORZO_API_ENABLED'].{Name:name,Value:value,SecretRef:secretRef}" \
              --output table
            exit 0
          fi

          sleep 10
        done

        echo "ERROR: Refund-status publisher revision did not become healthy within 10 minutes."
        exit 1
