server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: craves-user-chef-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/craves_business_db}
    username: ${SPRING_DATASOURCE_USERNAME:cravesadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MIN_IDLE:1}
      connection-timeout: 30000
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${CRAVES_KYC_MAX_FILE_SIZE:10MB}
      max-request-size: ${CRAVES_KYC_MAX_REQUEST_SIZE:12MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: ${CRAVES_REDIS_HEALTH_ENABLED:${CRAVES_TOKEN_REVOCATION_ENABLED:false}}

craves:
  jwt:
    issuer: ${CRAVES_JWT_ISSUER:https://api.craves.in/auth}
    audience: ${CRAVES_JWT_AUDIENCE:craves-api}
    verification-pem-base64: ${CRAVES_JWT_VERIFICATION_PEM_BASE64:}
  storage:
    endpoint-value: ${CRAVES_STORAGE_ENDPOINT_VALUE:}
    documents-container: ${CRAVES_STORAGE_DOCUMENTS_CONTAINER:documents}
    kyc-max-file-size-bytes: ${CRAVES_KYC_MAX_FILE_SIZE_BYTES:10485760}
  internal:
    auth-service-base-url: ${CRAVES_AUTH_INTERNAL_BASE_URL:}
    service-secret: ${CRAVES_INTERNAL_SERVICE_SECRET:}
    notification-service-base-url: ${CRAVES_NOTIFICATION_INTERNAL_BASE_URL:}
    notification-service-key: ${CRAVES_NOTIFICATION_INTERNAL_KEY:}
    notification-direct-dispatch-enabled: ${CRAVES_NOTIFICATION_DIRECT_DISPATCH_ENABLED:false}
    notice-dispatcher:
      enabled: ${CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_ENABLED:false}
      fixed-delay-ms: ${CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_FIXED_DELAY_MS:30000}
      batch-size: ${CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_BATCH_SIZE:25}
      max-attempts: ${CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_MAX_ATTEMPTS:5}
      retry-base-delay-seconds: ${CRAVES_NOTIFICATION_OUTBOX_DISPATCHER_RETRY_BASE_DELAY_SECONDS:60}
