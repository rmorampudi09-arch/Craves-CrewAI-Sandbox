server:
  port: 8080

spring:
  application:
    name: craves-notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/craves_business_db}
    username: ${SPRING_DATASOURCE_USERNAME:cravesadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: notification_schema
    schemas: notification_schema

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

craves:
  jwt:
    issuer: ${CRAVES_JWT_ISSUER:https://api.craves.in/auth}
    audience: ${CRAVES_JWT_AUDIENCE:craves-api}
    verification-pem-base64: ${CRAVES_JWT_VERIFICATION_PEM_BASE64:}
  internal:
    service-key: ${CRAVES_INTERNAL_SERVICE_KEY:}
  servicebus:
    enabled: ${CRAVES_SERVICEBUS_ENABLED:false}
    connection-string: ${CRAVES_SERVICEBUS_CONNECTION_STRING:}
    notification-queue-name: ${CRAVES_NOTIFICATION_QUEUE_NAME:notification-command}
  notification:
    delivery:
      worker-enabled: ${CRAVES_NOTIFICATION_DELIVERY_WORKER_ENABLED:false}
      push-enabled: ${CRAVES_NOTIFICATION_PUSH_ENABLED:false}
      email-enabled: ${CRAVES_NOTIFICATION_EMAIL_ENABLED:false}
      batch-size: ${CRAVES_NOTIFICATION_DELIVERY_BATCH_SIZE:50}
      max-attempts: ${CRAVES_NOTIFICATION_DELIVERY_MAX_ATTEMPTS:8}
      stale-lock-minutes: ${CRAVES_NOTIFICATION_DELIVERY_STALE_LOCK_MINUTES:5}
      retry-base-seconds: ${CRAVES_NOTIFICATION_DELIVERY_RETRY_BASE_SECONDS:30}
      fixed-delay-ms: ${CRAVES_NOTIFICATION_DELIVERY_FIXED_DELAY_MS:5000}
      firebase-service-account-json-base64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:}
      acs-email-connection-string: ${ACS_EMAIL_CONNECTION_STRING:}
      acs-email-sender-address: ${ACS_EMAIL_SENDER_ADDRESS:}
      acs-email-reply-to-address: ${ACS_EMAIL_REPLY_TO_ADDRESS:support@craves.in}
      auth-internal-base-url: ${CRAVES_AUTH_INTERNAL_BASE_URL:}
      auth-internal-service-secret: ${CRAVES_AUTH_INTERNAL_SERVICE_SECRET:}
    important-email:
      enabled: ${CRAVES_NOTIFICATION_IMPORTANT_EMAIL_ENABLED:false}
      event-types: ${CRAVES_NOTIFICATION_IMPORTANT_EMAIL_EVENT_TYPES:ORDER_CREATED,PAYMENT_SUCCEEDED,CHEF_ACCEPTED_ORDER,CHEF_REJECTED,CHEF_ACCEPTANCE_TIMEOUT,REFUND_PENDING,REFUNDED,REFUND_FAILED,DELIVERY_COURIER_ASSIGNED,DELIVERY_PICKED_UP,DELIVERY_IN_TRANSIT,DELIVERY_DELIVERED,DELIVERY_DELAYED,DELIVERY_CANCELLED,DELIVERY_FAILED,DELIVERY_RETURNING,DELIVERY_RETURNED,CHEF_APPLICATION_SUBMITTED,CHEF_APPLICATION_APPROVED,CHEF_APPLICATION_REJECTED}
  notification-recovery:
    api-enabled: ${CRAVES_NOTIFICATION_RECOVERY_API_ENABLED:false}
    maximum-list-size: ${CRAVES_NOTIFICATION_RECOVERY_MAXIMUM_LIST_SIZE:100}
