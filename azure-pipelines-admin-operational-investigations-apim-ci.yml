trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - script: |
      set -euo pipefail
      sudo apt-get update -qq
      sudo apt-get install -y --no-install-recommends libxml2-utils
      bash -n scripts/apim/configure-admin-operational-investigations-apim.sh
      bash -n scripts/apim/status-admin-operational-investigations-apim.sh
      bash -n scripts/apim/rollback-admin-operational-investigations-apim.sh
      xmllint --noout infra/apim/admin-operational-investigations/authenticated-policy.xml
    displayName: Validate APIM scripts and policy XML

  - script: |
      set -euo pipefail
      CONFIG='scripts/apim/configure-admin-operational-investigations-apim.sh'
      STATUS='scripts/apim/status-admin-operational-investigations-apim.sh'
      POLICY='infra/apim/admin-operational-investigations/authenticated-policy.xml'

      grep -q 'CONFIRM_APIM_WRITE' "$CONFIG"
      grep -q 'subscription-required false' "$CONFIG"
      grep -q 'Multiple APIM APIs own' "$CONFIG"
      grep -q 'backend-id policy blocks' "$CONFIG"
      grep -q 'get-admin-order-investigation' "$CONFIG"
      grep -q 'get-admin-payment-investigation' "$CONFIG"
      grep -q 'get-admin-refund-investigation' "$CONFIG"
      grep -q 'get-admin-delivery-command-investigation' "$CONFIG"
      grep -q 'HTTP_STATUS.*401' "$CONFIG"
      grep -q 'Authorization' "$POLICY"
      grep -q 'no-store' "$POLICY"
      grep -q 'X-Frame-Options' "$POLICY"
      grep -q 'SUCCESS: Admin operational investigation APIM status is healthy' "$STATUS"

      if grep -En 'set-header name="Authorization"|set-backend-service[^>]*backend-id' "$POLICY"; then
        echo 'ERROR: APIM policy attempts to emit authorization material or use backend-id.' >&2
        exit 1
      fi

      echo 'Admin operational investigation APIM gates passed.'
    displayName: Verify guarded gateway boundaries
