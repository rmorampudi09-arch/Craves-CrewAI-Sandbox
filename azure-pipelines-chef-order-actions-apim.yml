trigger: none
pr: none
parameters:
  - name: confirmConfigureChefOrderActions
    type: boolean
    default: false
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: apimName
    type: string
    default: apim-craves-prodlow-l3ing6
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - script: |
      set -euo pipefail
      CONFIRM='${{ parameters.confirmConfigureChefOrderActions }}'
      [[ "${CONFIRM,,}" == 'true' ]] || { echo 'ERROR: confirmConfigureChefOrderActions must be true.' >&2; exit 1; }
      bash -n scripts/apim/configure-chef-order-actions-apim.sh
    displayName: Confirm and validate chef order action APIM
  - task: AzureCLI@2
    displayName: Configure chef order action operations
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}' APIM='${{ parameters.apimName }}' ORDER_APP='${{ parameters.orderContainerAppName }}' bash scripts/apim/configure-chef-order-actions-apim.sh
