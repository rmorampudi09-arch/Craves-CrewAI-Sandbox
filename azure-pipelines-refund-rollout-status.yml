trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr
  - name: serviceBusNamespace
    type: string
    default: sb-craves-prodlow-l3ing6
  - name: serviceBusTopic
    type: string
    default: craves-domain-events
  - name: integrationRefundSubscription
    type: string
    default: integration-service-refund-requested
  - name: orderRefundStatusSubscription
    type: string
    default: order-service-refund-status-changed

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Report refund rollout stage, backlog and DLQs
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        bash scripts/refund/refund-rollout-status.sh
    env:
      RESOURCE_GROUP: ${{ parameters.resourceGroupName }}
      ORDER_APP: ${{ parameters.orderContainerAppName }}
      INTEGRATION_APP: ${{ parameters.integrationContainerAppName }}
      SERVICE_BUS_NAMESPACE: ${{ parameters.serviceBusNamespace }}
      SERVICE_BUS_TOPIC: ${{ parameters.serviceBusTopic }}
      INTEGRATION_REFUND_SUBSCRIPTION: ${{ parameters.integrationRefundSubscription }}
      ORDER_REFUND_STATUS_SUBSCRIPTION: ${{ parameters.orderRefundStatusSubscription }}
