trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: Use Python 3.12
  - script: |
      set -euo pipefail
      python scripts/release/validate-flyway-migrations.py
    displayName: Validate Flyway ordering and destructive-change markers
