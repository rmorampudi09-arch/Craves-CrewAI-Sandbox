trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24

  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
      npm run build
    displayName: Verify admin account intervention web

  - script: |
      set -euo pipefail
      ROUTE='apps/customer-web-next/src/app/api/admin/accounts/[identityId]/route.ts'
      CONTRACT='apps/customer-web-next/src/lib/admin-account-intervention-contract.ts'
      COMPONENT='apps/customer-web-next/src/components/admin-account-intervention.tsx'

      grep -q 'isSameOrigin' "$ROUTE"
      grep -q 'confirmation !== action' "$CONTRACT"
      grep -q 'Type {action} to confirm' "$COMPONENT"
      grep -q 'Reload the identity status before intervening' "$COMPONENT"
      grep -q 'Cache-Control.*no-store' "$ROUTE"

      if grep -REn '(localStorage|sessionStorage|console\.(log|debug)|firebaseUid|phoneNumber)' "$ROUTE" "$CONTRACT" "$COMPONENT"; then
        echo 'ERROR: Account intervention web exposes forbidden storage, logging or raw identity data.' >&2
        exit 1
      fi

      echo 'Admin account intervention safety gates passed.'
    displayName: Verify high-impact action boundaries
