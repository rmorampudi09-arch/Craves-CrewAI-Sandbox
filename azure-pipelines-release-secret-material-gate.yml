trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    persistCredentials: false
    fetchDepth: 1
  - script: |
      set -euo pipefail
      chmod +x scripts/release/scan-secret-material.sh
      scripts/release/scan-secret-material.sh .
    displayName: Scan tracked source for credential material
