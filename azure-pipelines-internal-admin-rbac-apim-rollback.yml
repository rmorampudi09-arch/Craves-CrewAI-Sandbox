trigger: none
pr: none

parameters:
  - name: confirmRollback
    type: boolean
    default: false
  - name: deleteEmptyApi
    type: boolean
    default: false
  - name: resourceGroupName
    displayName: Azure resource group
    type: string
    default: rg-craves-prodlow-centralindia
  - name: apimServiceName
    displayName: API Management service
    type: string
    default: apim-craves-prodlow-l3ing6

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: AzureCLI@2
    displayName: Roll back internal administrator RBAC APIM
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        if [[ '${{ parameters.confirmRollback }}' != 'True' && '${{ parameters.confirmRollback }}' != 'true' ]]; then
          echo 'ERROR: confirmRollback must be enabled.' >&2
          exit 1
        fi
        CONFIRM_APIM_ROLLBACK=true DELETE_EMPTY_API='${{ parameters.deleteEmptyApi }}' \
          bash scripts/apim/rollback-internal-admin-rbac-apim.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimServiceName }}
