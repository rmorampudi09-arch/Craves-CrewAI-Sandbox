trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
    displayName: Typecheck and test customer subscription plans
  - script: |
      set -euo pipefail
      grep -q '/subscriptions/plans' apps/customer-web-next/src/app/api/subscriptions/plans/route.ts
      if grep -REn '(chefIdentityId|customerIdentityId|localStorage|sessionStorage|console\.(log|debug))' \
        apps/customer-web-next/src/components/subscription-plan-browser.tsx \
        apps/customer-web-next/src/app/subscriptions/plans \
        apps/customer-web-next/src/app/api/subscriptions/plans; then
        echo 'ERROR: Subscription plan runtime exposes internal identities, browser storage or debug logging.' >&2
        exit 1
      fi
      echo 'Customer subscription plan gates passed.'
    displayName: Verify subscription plan privacy
