trigger: none
pr: none
parameters:
  - name: confirmConfigureCustomerCheckout
    type: boolean
    default: false
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - script: |
      set -euo pipefail
      CONFIRM='${{ parameters.confirmConfigureCustomerCheckout }}'
      [[ "${CONFIRM,,}" == 'true' ]] || { echo 'ERROR: confirmConfigureCustomerCheckout must be true.' >&2; exit 1; }
    displayName: Confirm customer checkout APIM change
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/configure-customer-checkout-apim.sh
    displayName: Configure customer checkout APIM operations
