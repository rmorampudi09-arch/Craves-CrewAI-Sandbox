trigger: none
pr: none
pool:
  vmImage: ubuntu-latest
variables:
  appPath: apps/customer-web-next
steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd "$(appPath)"
      npm install --ignore-scripts
      npm run typecheck
      npm run test
      npm run build
    displayName: Typecheck, test and build customer cart
  - script: |
      set -euo pipefail
      bash -n scripts/apim/configure-customer-cart-apim.sh
      python3 - <<'PY'
      import xml.etree.ElementTree as ET
      ET.parse('infra/apim/customer-cart/customer-cart-policy.xml')
      print('Customer cart policy XML is valid.')
      PY
      grep -q 'isSameOrigin' apps/customer-web-next/src/app/api/cart/items/route.ts
      grep -q 'foodSubtotal' apps/customer-web-next/src/lib/cart-contract.ts
      if grep -REn '(platformFee|taxAmount|deliveryFee).*[-+*/]' apps/customer-web-next/src/components/customer-cart.tsx apps/customer-web-next/src/lib/cart-contract.ts; then
        echo 'ERROR: Frontend cart code appears to calculate checkout fees.' >&2
        exit 1
      fi
      echo 'Cart ownership, pricing and APIM safety controls passed.'
    displayName: Verify cart safety controls
