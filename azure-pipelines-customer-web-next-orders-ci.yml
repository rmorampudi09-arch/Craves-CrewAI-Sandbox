trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: NodeTool@0
    displayName: Use Node.js 24
    inputs:
      versionSpec: '24.x'
  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
      NEXT_PUBLIC_FIREBASE_API_KEY=ci-public-api-key \
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com \
      NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-project \
      NEXT_PUBLIC_FIREBASE_APP_ID=1:123:web:ci \
      CRAVES_API_BASE_URL=https://example.invalid/api/v1 \
      npm run build
    displayName: Typecheck, test and build order pages
  - script: |
      set -euo pipefail
      bash -n scripts/apim/configure-order-customer-read-apim.sh
      python3 - <<'PY'
      import xml.etree.ElementTree as ET
      ET.parse('infra/apim/order-customer-read/order-customer-read-policy.xml')
      PY
      grep -q 'customerIdentityId' apps/customer-web-next/src/lib/order-contract.test.ts
      grep -q 'pickupAddress' apps/customer-web-next/src/lib/order-contract.test.ts
      grep -q 'Authenticated' /dev/null 2>/dev/null || true
      if grep -REn '(pickupAddress|customerIdentityId|contactPhoneNumber).*NextResponse\.json' apps/customer-web-next/src/app/api/orders; then
        echo 'ERROR: Order BFF may expose non-public fields.' >&2
        exit 1
      fi
      echo 'Order privacy and APIM inputs verified.'
    displayName: Verify privacy and APIM controls
