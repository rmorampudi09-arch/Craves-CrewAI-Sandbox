trigger: none
pr: none
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
      npm run build
    displayName: Build and test chef kitchen profile
  - script: |
      set -euo pipefail
      bash -n scripts/apim/configure-chef-kitchen-profile-apim.sh
      if grep -REn '(identityId|localStorage|sessionStorage|console\.(log|debug))' \
        apps/customer-web-next/src/lib/chef-kitchen-* \
        apps/customer-web-next/src/app/api/chef/kitchen \
        apps/customer-web-next/src/components/chef-kitchen-form.tsx --exclude='*.test.ts'; then
        echo 'ERROR: Chef kitchen runtime exposes identity fields, insecure storage or debug logging.' >&2
        exit 1
      fi
      grep -q 'SUSPENDED' apps/customer-web-next/src/lib/chef-kitchen-contract.test.ts
      echo 'Chef kitchen privacy and suspension gates passed.'
    displayName: Verify chef kitchen safety gates
