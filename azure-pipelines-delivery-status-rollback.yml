trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: orderContainerAppName
    type: string
    default: ca-craves-order-service-prodlow
  - name: integrationContainerAppName
    type: string
    default: ca-craves-integration-service-pr

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: Disable delivery status event flow
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        RG='${{ parameters.resourceGroupName }}'
        ORDER_APP='${{ parameters.orderContainerAppName }}'
        INTEGRATION_APP='${{ parameters.integrationContainerAppName }}'

        az containerapp update \
          --resource-group "$RG" \
          --name "$ORDER_APP" \
          --set-env-vars \
            CRAVES_DELIVERY_STATUS_CONSUMER_ENABLED=false \
          -o none

        az containerapp update \
          --resource-group "$RG" \
          --name "$INTEGRATION_APP" \
          --set-env-vars \
            CRAVES_DELIVERY_STATUS_PUBLISHER_ENABLED=false \
            CRAVES_DELIVERY_WEBHOOK_PROCESSING_ENABLED=false \
            CRAVES_DELIVERY_TRACKING_RECONCILIATION_ENABLED=false \
            BORZO_API_ENABLED=false \
          -o none

        echo "Delivery status event flow returned to fail-closed state."
        echo "No inbox, history, outbox, delivery-job, or provider audit row was deleted."
