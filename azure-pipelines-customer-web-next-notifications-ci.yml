trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: NodeTool@0
    displayName: Use Node.js 24
    inputs:
      versionSpec: '24.x'
  - script: |
      set -euo pipefail
      cd apps/customer-web-next
      npm install --ignore-scripts
      npm run typecheck
      npm run test
      NEXT_PUBLIC_FIREBASE_API_KEY=ci-public-api-key \
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ci.firebaseapp.com \
      NEXT_PUBLIC_FIREBASE_PROJECT_ID=ci-project \
      NEXT_PUBLIC_FIREBASE_APP_ID=1:123:web:ci \
      CRAVES_API_BASE_URL=https://example.invalid/api/v1 \
      npm run build
    displayName: Typecheck, test and build notification inbox
  - script: |
      set -euo pipefail
      grep -q 'sameOrigin' 'apps/customer-web-next/src/app/api/notifications/[noticeId]/read/route.ts'
      grep -q 'Cache-Control' apps/customer-web-next/src/app/api/notifications/route.ts
      if grep -REn '(rawPayload|internalEventKey|providerDeliveryId).*NextResponse\.json' apps/customer-web-next/src/app/api/notifications; then
        echo 'ERROR: Notification BFF may expose internal payload data.' >&2
        exit 1
      fi
      echo 'Notification privacy and same-origin controls verified.'
    displayName: Verify notification security controls
