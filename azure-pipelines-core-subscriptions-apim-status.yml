trigger: none
pr: none

parameters:
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: apimName
    type: string
    default: apim-craves-prodlow-l3ing6
  - name: subscriptionContainerAppName
    type: string
    default: ca-craves-subscription-service-p
  - name: customerWebContainerAppName
    type: string
    default: ca-craves-web-prodlow
  - name: apimHost
    type: string
    default: api.craves.in

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Diagnose core Subscription network layers
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/diagnose-core-subscriptions-network.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimName }}
      SUB_APP: ${{ parameters.subscriptionContainerAppName }}

  - task: AzureCLI@2
    displayName: Diagnose Subscription HTTP and database runtime
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/diagnose-subscription-http-db-runtime.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimName }}
      SUB_APP: ${{ parameters.subscriptionContainerAppName }}
      DATABASE_NAME: craves_business_db

  - task: AzureCLI@2
    displayName: Verify core Subscription APIM routes and transport
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/status-core-subscriptions-apim.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimName }}
      SUB_APP: ${{ parameters.subscriptionContainerAppName }}
      WEB_APP: ${{ parameters.customerWebContainerAppName }}
      APIM_HOST: ${{ parameters.apimHost }}
