trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: Use Node.js 24
  - script: |
      set -euo pipefail
      cd apps/mobile/customer-app
      npm install --ignore-scripts
      npm run typecheck
      npm run test
    displayName: Typecheck and test mobile subscription management
  - script: |
      set -euo pipefail
      grep -q 'createSubscription' apps/mobile/customer-app/src/screens/SubscriptionEnrollmentScreen.tsx
      grep -q "action: 'pause'" apps/mobile/customer-app/src/screens/SubscriptionsScreen.tsx
      grep -q "action: 'cancel'" apps/mobile/customer-app/src/screens/SubscriptionsScreen.tsx
      if grep -REn '(customerIdentityId|chefIdentityId|AsyncStorage|console\.(log|debug))' \
        apps/mobile/customer-app/src/subscriptions \
        apps/mobile/customer-app/src/screens/SubscriptionEnrollmentScreen.tsx \
        apps/mobile/customer-app/src/screens/SubscriptionsScreen.tsx --exclude='*.test.ts'; then
        echo 'ERROR: Mobile subscription runtime exposes internal identities, insecure storage or debug logging.' >&2
        exit 1
      fi
      if grep -REn '(renew|resume|refund|credit|payout)' \
        apps/mobile/customer-app/src/screens/SubscriptionEnrollmentScreen.tsx \
        apps/mobile/customer-app/src/screens/SubscriptionsScreen.tsx; then
        echo 'ERROR: Unsupported mobile subscription action was introduced.' >&2
        exit 1
      fi
      if grep -REn 'console\.(log|debug).*accessToken|accessToken.*console\.(log|debug)' apps/mobile/customer-app/src; then
        echo 'ERROR: Mobile runtime logs an access token.' >&2
        exit 1
      fi
      echo 'Mobile subscription lifecycle gates passed.'
    displayName: Verify mobile subscription safety
