trigger: none
pr: none
parameters:
  - name: confirmConfigureCustomerPayments
    type: boolean
    default: false
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - script: |
      set -euo pipefail
      CONFIRM='${{ parameters.confirmConfigureCustomerPayments }}'
      [[ "${CONFIRM,,}" == 'true' ]] || { echo 'ERROR: confirmConfigureCustomerPayments must be true.' >&2; exit 1; }
    displayName: Confirm customer payment APIM change
  - task: AzureCLI@2
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/configure-customer-payments-apim.sh
    displayName: Configure owned customer payment APIM operations
