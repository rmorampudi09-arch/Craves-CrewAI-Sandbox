trigger: none
pr: none

parameters:
  - name: confirmApimWrite
    type: boolean
    default: false
  - name: resourceGroupName
    type: string
    default: rg-craves-prodlow-centralindia
  - name: apimName
    type: string
    default: apim-craves-prodlow-l3ing6
  - name: subscriptionContainerAppName
    type: string
    default: ca-craves-subscription-service-p

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: Enforce Chef-owned meal plan APIM workflow
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/configure-chef-subscription-plan-workflow-apim.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimName }}
      SUBSCRIPTION_APP: ${{ parameters.subscriptionContainerAppName }}
      CONFIRM_APIM_WRITE: ${{ parameters.confirmApimWrite }}

  - task: AzureCLI@2
    displayName: Configure Admin meal plan review reads
    inputs:
      azureSubscription: $(AZURE_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: scriptPath
      scriptPath: scripts/apim/configure-chef-subscription-admin-read-apim.sh
    env:
      RG: ${{ parameters.resourceGroupName }}
      APIM: ${{ parameters.apimName }}
      SUBSCRIPTION_APP: ${{ parameters.subscriptionContainerAppName }}
      CONFIRM_APIM_WRITE: ${{ parameters.confirmApimWrite }}
