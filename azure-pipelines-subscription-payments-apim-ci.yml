trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - bash: |
      set -euo pipefail
      bash -n scripts/apim/configure-subscription-payments-apim.sh
      bash -n scripts/apim/status-subscription-payments-apim.sh
      bash -n scripts/apim/rollback-subscription-payments-apim.sh
      python3 - <<'PY'
      import xml.etree.ElementTree as ET
      for path in (
          'infra/apim/subscription-payments/authenticated-policy.xml',
          'infra/apim/subscription-payments/cashfree-webhook-policy.xml',
      ):
          ET.parse(path)
          print(f'Valid XML: {path}')
      PY
    displayName: Validate subscription payment APIM assets

  - bash: |
      set -euo pipefail
      APPLY='scripts/apim/configure-subscription-payments-apim.sh'
      STATUS='scripts/apim/status-subscription-payments-apim.sh'
      ROLLBACK='scripts/apim/rollback-subscription-payments-apim.sh'

      grep -q 'CONFIRM_APIM_WRITE' "$APPLY"
      grep -q 'CONFIRM_APIM_ROLLBACK' "$ROLLBACK"
      grep -q 'ADOPT:' "$APPLY"
      grep -q 'Authorization' infra/apim/subscription-payments/authenticated-policy.xml

      # Customer Meal Plans requires this customer-owned lookup because billing invoices
      # are generated asynchronously after subscription enrollment.
      grep -Fq 'get-subscription-payment-for-subscription' "$APPLY"
      grep -Fq 'GET" "/subscriptions/{subscriptionId}"' "$APPLY"
      grep -Fq 'GET "/subscriptions/{subscriptionId}" true' "$STATUS"
      grep -Fq 'GET "/subscriptions/{subscriptionId}"' "$ROLLBACK"

      # Existing invoice/order/webhook operations must remain present.
      grep -Fq 'GET" "/invoices/{invoiceId}"' "$APPLY"
      grep -Fq 'POST" "/invoices/{invoiceId}/orders"' "$APPLY"
      grep -Fq 'POST" "/webhooks/cashfree"' "$APPLY"

      if grep -q 'A Bearer access token is required' infra/apim/subscription-payments/cashfree-webhook-policy.xml; then
        echo 'ERROR: Cashfree webhook policy unexpectedly requires Bearer authentication.' >&2
        exit 1
      fi
      if grep -q '<set-body' infra/apim/subscription-payments/cashfree-webhook-policy.xml; then
        echo 'ERROR: Cashfree webhook policy must not transform the signed raw request body.' >&2
        exit 1
      fi
      if grep -REn '(client-secret|accesskey=|connectionString|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' \
        infra/apim/subscription-payments scripts/apim/*subscription-payments*; then
        echo 'ERROR: Potential credential material found in subscription payment APIM assets.' >&2
        exit 1
      fi
      echo 'Subscription payment APIM fail-closed gates passed.'
    displayName: Verify subscription payment APIM safety gates
